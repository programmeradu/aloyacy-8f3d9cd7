# Self-contained local stack: the Aloya web app plus a Postgres/PostGIS
# database. One command from a fresh clone:
#
#   cp .env.example .env && docker compose up --build
#
# The app answers on http://localhost:8080 and its container healthcheck polls
# /api/public/health, so `docker compose ps` reports real readiness rather than
# "the process started".
#
# For the full self-hosted backend (auth, PostgREST, Realtime, Storage, Kong),
# use deploy/supabase/docker-compose.yml instead of the `db` service here.

name: aloya

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:8080/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  db:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: aloya
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/supabase/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "aloya"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
