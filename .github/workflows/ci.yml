name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build must succeed without real credentials. These are inert
  # placeholders so Vite can inline the VITE_* names it expects.
  VITE_CUSTOM_SUPABASE_URL: http://localhost:54321
  VITE_CUSTOM_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  PUBLIC_SITE_URL: http://localhost:8080

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Env template parity
        run: bun run check:env

      - name: Secret scan
        run: bun run check:secrets

      - name: Test
        run: bun run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Dependency audit
        run: bun audit --audit-level=high

      - name: Build
        run: bun run build

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck mobile
        working-directory: mobile
        run: bunx tsc --noEmit

      - name: Test mobile logic
        run: bun run test:mobile:coverage
