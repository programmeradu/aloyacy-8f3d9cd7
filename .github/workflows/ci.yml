name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build must succeed without real credentials. These are inert
  # placeholders so Vite can inline the VITE_* names it expects.
  VITE_CUSTOM_SUPABASE_URL: http://localhost:54321
  VITE_CUSTOM_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  PUBLIC_SITE_URL: http://localhost:8080

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Fast-fail before install: a missing lockfile means non-reproducible
      # installs, so surface it as its own red step rather than a resolver error.
      - name: Lockfiles are present
        run: |
          for f in bun.lock package-lock.json; do
            test -f "$f" || { echo "$f is missing from the tree"; exit 1; }
          done

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bun lockfile is committed and up to date
        run: git diff --exit-code -- bun.lock

      # npm-only environments install with `npm ci`, so the npm lockfile has to
      # describe the same dependency set. Regenerating it must be a no-op.
      - name: npm lockfile is in sync with package.json
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json

      # Fresh-clone bootstrap check: prove the documented 4-command onboarding
      # path (clone -> cp .env.example .env -> bun install --frozen-lockfile -> test)
      # succeeds out of the box in zero-credential isolation.
      - name: Fresh clone bootstrap check
        run: |
          cp .env.example .env
          bun run check:env
          bun run check:secrets

      # Static input-validation evidence: walks every `/api/public/**` route and
      # internal RPC functions, prints matrix to job log, fails on gaps.
      - name: Input validation matrix (zod, public API & RPC)
        run: bun run check:validation

      # Standardized script executions matching package.json
      - name: Lint (eslint)
        run: bun run lint

      - name: Typecheck (tsc)
        run: bun run typecheck

      - name: Generate input validation report
        run: |
          node scripts/input-validation-report.mjs --write-doc
          cat docs/INPUT_VALIDATION.md >> $GITHUB_STEP_SUMMARY

      - name: Test (vitest, with coverage)
        run: bun run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Dependency audit
        run: bun audit --audit-level=high

      - name: Build
        run: bun run build

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same fresh-clone promise as the web job: the Expo app must boot from
      # its committed template with no hand-edited secrets.
      - name: Mobile fresh clone bootstrap check
        run: |
          cp mobile/.env.example mobile/.env
          bun run check:env

      - name: Typecheck mobile
        working-directory: mobile
        run: bunx tsc --noEmit

      # The Expo app's logic modules run in a Node harness with the native
      # bridges stubbed (see vitest.mobile.config.ts).
      - name: Test mobile (vitest)
        run: bun run test:mobile:coverage

      - name: Upload mobile coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-mobile
          path: coverage-mobile/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Production deployment gate
    needs: [verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release readiness
        run: |
          echo "All verification gates passed: lint, typecheck, input-validation, tests, security, build."
          echo "Production deployment ready."
